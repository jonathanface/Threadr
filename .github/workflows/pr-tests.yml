name: Pull Request Tests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - staging
      # Note: Production PRs don't run tests since they come from staging where tests already passed
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      STRIPE_SECRET: sk_test_dummy_key_for_ci
      SESSION_SECRET: test_session_secret_at_least_32_chars_long_for_security

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download Go modules
        run: go mod download

      - name: Run Go unit tests
        run: go test ./... -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: static/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('static/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install frontend dependencies
        working-directory: ./static
        run: npm ci

      - name: Run frontend unit tests
        working-directory: ./static
        run: npm test

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ All tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Tests failed" >> $GITHUB_STEP_SUMMARY
          fi

  lint:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Pinning the major version protects CI from breaking on a
          # surprise upgrade. Bump deliberately when local devs upgrade.
          version: v2.12
          # No --fix in CI: linters report, they don't mutate.
          args: --timeout=5m

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: static/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('static/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install frontend dependencies
        working-directory: ./static
        run: npm ci

      - name: Run ESLint
        working-directory: ./static
        # `npm run lint` invokes eslint with --fix, which would silently
        # auto-mutate code in CI. Call eslint directly instead and treat
        # warnings as errors so a future contributor can't introduce one
        # under the radar.
        run: npx eslint . --max-warnings 0
