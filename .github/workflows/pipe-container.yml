name: Deploy to Amazon ECS

on:
  pull_request:
    types: [closed]
    branches:
      - production
      - staging

env:
  ECR_REPOSITORY: richdocter
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check_merge:
    name: Check if PR was merged
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Check if PR was merged (not just closed)
        id: check
        run: |
          if [ "${{ github.event.pull_request.merged }}" == "true" ]; then
            echo "PR was merged, proceeding with deployment"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "PR was closed without merging, skipping deployment"
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Check production merge source
        if: steps.check.outputs.should_deploy == 'true' && github.base_ref == 'production'
        run: |
          if [ "${{ github.head_ref }}" != "staging" ]; then
            echo "ERROR: You can only merge to production from staging branch."
            echo "Attempted merge from: ${{ github.head_ref }}"
            exit 1
          fi
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check_merge
    if: needs.check_merge.outputs.should_deploy == 'true'

    steps:
      - name: Load VITE vars (staging/prod aware)
        run: |
          STRIPE_KEY_VALUE="${{ github.base_ref == 'production' && secrets.STRIPE_PUB_KEY_PROD || secrets.STRIPE_PUB_KEY_STAGE }}"
          echo "::add-mask::$STRIPE_KEY_VALUE"
          echo "APP_VERSION=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "MODE=${{ github.base_ref }}"   >> "$GITHUB_ENV"
          echo "STRIPE_KEY=$STRIPE_KEY_VALUE" >> "$GITHUB_ENV"

          # Cognito is only used for staging
          if [ "${{ github.base_ref }}" == "staging" ]; then
            COGNITO_AUTHORITY_VALUE="${{ secrets.COGNITO_AUTHORITY }}"
            COGNITO_CLIENT_ID_VALUE="${{ secrets.COGNITO_CLIENT_ID }}"
            COGNITO_DOMAIN_VALUE="${{ secrets.COGNITO_DOMAIN }}"
            COGNITO_REDIRECT_URI_VALUE="${{ secrets.COGNITO_REDIRECT_URI_STAGE }}"
            COGNITO_LOGOUT_URI_VALUE="${{ secrets.COGNITO_LOGOUT_URI_STAGE }}"
            echo "::add-mask::$COGNITO_AUTHORITY_VALUE"
            echo "::add-mask::$COGNITO_CLIENT_ID_VALUE"
            echo "::add-mask::$COGNITO_DOMAIN_VALUE"
            echo "::add-mask::$COGNITO_REDIRECT_URI_VALUE"
            echo "::add-mask::$COGNITO_LOGOUT_URI_VALUE"
            echo "COGNITO_AUTHORITY=$COGNITO_AUTHORITY_VALUE" >> "$GITHUB_ENV"
            echo "COGNITO_CLIENT_ID=$COGNITO_CLIENT_ID_VALUE" >> "$GITHUB_ENV"
            echo "COGNITO_DOMAIN=$COGNITO_DOMAIN_VALUE" >> "$GITHUB_ENV"
            echo "COGNITO_REDIRECT_URI=$COGNITO_REDIRECT_URI_VALUE" >> "$GITHUB_ENV"
            echo "COGNITO_LOGOUT_URI=$COGNITO_LOGOUT_URI_VALUE" >> "$GITHUB_ENV"
          else
            # Production doesn't use Cognito - set empty values
            echo "COGNITO_AUTHORITY=" >> "$GITHUB_ENV"
            echo "COGNITO_CLIENT_ID=" >> "$GITHUB_ENV"
            echo "COGNITO_DOMAIN=" >> "$GITHUB_ENV"
            echo "COGNITO_REDIRECT_URI=" >> "$GITHUB_ENV"
            echo "COGNITO_LOGOUT_URI=" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" . \
            --build-arg APP_VERSION=${{ env.APP_VERSION }} \
            --build-arg MODE=${{ env.MODE }} \
            --build-arg STRIPE_KEY=${{ env.STRIPE_KEY }} \
            --build-arg COGNITO_AUTHORITY=${{ env.COGNITO_AUTHORITY }} \
            --build-arg COGNITO_CLIENT_ID=${{ env.COGNITO_CLIENT_ID }} \
            --build-arg COGNITO_REDIRECT_URI=${{ env.COGNITO_REDIRECT_URI }} \
            --build-arg COGNITO_DOMAIN=${{ env.COGNITO_DOMAIN }} \
            --build-arg COGNITO_LOGOUT_URI=${{ env.COGNITO_LOGOUT_URI }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" > image.txt

      - name: Upload image artifact #have to store image as an artifact b/c github flags the output as a secret and skips it
        uses: actions/upload-artifact@v5
        with:
          name: image
          path: image.txt

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    env:
      ECS_SERVICE: ${{ github.base_ref == 'production' && secrets.AWS_ECS_SERVICE || secrets.AWS_ECS_SERVICE_STAGING }}
      ECS_CLUSTER: ${{ github.base_ref == 'production' && secrets.AWS_ECS_CLUSTER || secrets.AWS_ECS_CLUSTER_STAGING }}
      ECS_TASK_DEFINITION: ${{ github.base_ref == 'production' && '.aws/aws_ecs_task.json' || '.aws/aws_ecs_task_staging.json' }}
      CONTAINER_NAME: ${{ github.base_ref == 'production' && 'richdocter' || 'web-container' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download image artifact
        uses: actions/download-artifact@v5
        with:
          name: image

      - name: Extract image name
        run: |
          echo "IMAGE=$(cat image.txt)" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Show service load balancer mapping
        run: |
          aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}" \
            --query 'services[0].loadBalancers' --output table

      - name: Show recent ECS service events
        run: |
          aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}" \
            --query 'services[0].events[0:10].[createdAt,message]' --output table

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{env.IMAGE }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
