name: Deploy to Amazon ECS

on:
  push:
    branches:
      - production
      - staging

env:
  ECR_REPOSITORY: richdocter

jobs:
  check_branch:
    name: Safeguard production branch
    runs-on: ubuntu-latest
    steps:
      - name: Check branch
        if: github.base_ref == 'production' && github.head_ref != 'staging'
        run: |
          echo "ERROR: You can only merge to production from staging."
          exit 1
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Load VITE vars (staging/prod aware)
        run: |
          STRIPE_KEY_VALUE="${{ github.ref == 'refs/heads/production' && secrets.STRIPE_PUB_KEY_PROD || secrets.STRIPE_PUB_KEY_STAGE }}"
          echo "::add-mask::$STRIPE_KEY_VALUE"
          echo "APP_VERSION=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "MODE=${GITHUB_REF_NAME}"   >> "$GITHUB_ENV"
          echo "STRIPE_KEY=$STRIPE_KEY_VALUE" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" . \
            --build-arg APP_VERSION=${{ env.APP_VERSION }} \
            --build-arg MODE=${{ env.MODE }} \
            --build-arg STRIPE_KEY=${{ env.STRIPE_KEY }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" > image.txt

      - name: Upload image artifact #have to store image as an artifact b/c github flags the output as a secret and skips it
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.txt

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    env:
      ECS_SERVICE: ${{ github.ref == 'refs/heads/production' && secrets.AWS_ECS_SERVICE || secrets.AWS_ECS_SERVICE_STAGING }}
      ECS_CLUSTER: ${{ github.ref == 'refs/heads/production' && secrets.AWS_ECS_CLUSTER || secrets.AWS_ECS_CLUSTER_STAGING }}
      ECS_TASK_DEFINITION: ${{ github.ref == 'refs/heads/production' && '.aws/aws_ecs_task.json' || '.aws/aws_ecs_task_staging.json' }}
      CONTAINER_NAME: ${{ github.ref == 'refs/heads/production' && 'richdocter' || 'web-container' }}
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image

      - name: Extract image name
        run: |
          echo "IMAGE=$(cat image.txt)" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Show service load balancer mapping
        run: |
          aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}" \
            --query 'services[0].loadBalancers' --output table

      - name: Show recent ECS service events
        run: |
          aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}" \
            --query 'services[0].events[0:10].[createdAt,message]' --output table


      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{env.IMAGE }}
        

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true